<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Is France Match-Ready? · Pitch Report · World Cup 2026 Analysis"/>
  <title>Is France Match-Ready? · Pitch Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/styles.css"/>
  <script>
    (function(){
      var s=localStorage.getItem('wc26-theme');
      if(s){document.documentElement.setAttribute('data-theme',s);return;}
      if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme','dark');
    })();
  </script>
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <a href="../" class="site-logo">
      <span class="site-logo-icon">⚽</span>
      <div>
        <div class="site-logo-text">Pitch <span>Report</span></div>
        <div class="site-logo-sub">World Cup 2026 Analysis</div>
      </div>
    </a>
    <nav class="site-nav">
      <a href="../">Home</a>
      <a href="../#reports">All Reports</a>
    </nav>
    <button id="themeToggle" aria-label="Toggle dark mode" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">🌙</button>
  </div>
</header>

<main class="site-wrap">

  <!-- Byline bar -->
  <div class="feed-meta" style="margin-bottom:20px">
    <div class="feed-meta-left">
      <div class="feed-live-dot"></div>
      <span>Monday, June 8, 2026</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;font-size:12px">
      <span><strong>Polar Bear 🐻</strong></span>
    </div>
  </div>

  <!-- Report content -->
  <article class="wc-article">
    <header class="wc-article-header">
      <h1>Is France Match-Ready?</h1>
      <p class="wc-article-meta">Monday, June 8, 2026</p>
    </header>

    
  </article>

  <!-- Article footer -->
  <div style="margin-top:24px;padding:16px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);font-size:12px;color:var(--text-3);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;">
    <div style="display:flex;gap:16px;flex-wrap:wrap">
      <span>By <strong>Polar Bear 🐻</strong></span>
    </div>
  </div>

  <!-- Pagination -->
  <div style="margin-top:20px;display:flex;justify-content:space-between;font-size:13px">
    <span id="prevLink"></span>
    <a href="../" style="color:var(--wc-blue);text-decoration:none;font-weight:600">← All Reports</a>
    <span id="nextLink"></span>
  </div>

</main>

<footer class="site-footer">
  <p>Pitch Report · <a href="../">Home</a> · Monday, June 8, 2026</p>
</footer>

<script>
  var toggle=document.getElementById('themeToggle');
  function getTheme(){return document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';}
  function setTheme(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem('wc26-theme',t);toggle.textContent=t==='dark'?'☀️':'🌙';}
  toggle.addEventListener('click',function(){setTheme(getTheme()==='dark'?'light':'dark');});
  toggle.textContent=getTheme()==='dark'?'☀️':'🌙';
</script>

</body>
</html>
