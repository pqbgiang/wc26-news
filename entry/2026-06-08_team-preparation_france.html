. ET). This is France's first confirmed fixture and their opening group stage test in a Group I that also features Iraq and Norway.\",\n          \"metadata\": {\n            \"teams\": [\"France\", \"Senegal\"],\n            \"venue\": \"MetLife Stadium, East Rutherford, New Jersey\",\n            \"group\": \"Group I\",\n            \"isPreview\": true\n          }\n        }\n      ]\n    },\n    {\n      \"title\": \"🇸🇳 OPPONENT ANALYSIS: Senegal\",\n      \"emoji\": \"⚽\",\n      \"items\": [\n        {\n          \"type\": \"tactical\",\n          \"headline\": \"Confirmed Formation \u0026 Playing Style\",\n          \"body\": \"Senegal operates a structured 4-2-3-1/4-3-3 system under coach Pape Thiaw that prioritizes defensive solidity while utilizing direct attacking transitions. The Lions emphasize high pressing, smooth transitions between defensive and attacking phases, and rapid ball circulation through speedster wingers in wide areas. Their tactical identity relies on winger pace and directness rather than intricate midfield creativity, which historically presents both a strength in transition and a vulnerability against organized, high-pressing defenses.\",\n          \"metadata\": {\n            \"teams\": [\"Senegal\"]\n          }\n        },\n        {\n          \"type\": \"tactical\",\n          \"headline\": \"Key Confirmed Threats\",\n          \"body\": \"Sadio Mané (Al-Nassr), 34, captains the side as Senegal's all-time record goalscorer with 55 international goals. He scored five goals in qualifying and was AFCON 2025 Player of the Tournament. Nicolas Jackson (Bayern Munich/Chelsea loan), Iliman Ndiaye (Everton), and Ismaïla Sarr (Crystal Palace) provide attacking depth with Premier League experience. In midfield, Idrissa Gana Gueye (Fenerbahçe), Senegal's most-capped player with 131 appearances, screens defensively. Defensively, captain Kalidou Koulibaly (103 caps, age 34) anchors the center with Moussa Niakhaté alongside. Édouard Mendy (former Chelsea) guards the goal.\",\n          \"metadata\": {\n            \"teams\": [\"Senegal\"]\n          }\n        },\n        {\n          \"type\": \"tactical\",\n          \"headline\": \"Confirmed Weaknesses to Exploit\",\n          \"body\": \"Senegal's midfield lacks elite creativity and incisive passing to break down compact defenses. Both Koulibaly (34) and Mané (34) are aging, and relying heavily on winger pace in transition means they are vulnerable to sides that control possession and compress space between the lines. Senegal conceded just two goals en route to the AFCON 2025 title but face significantly tougher attacking opponents in France and Norway. Creative inconsistency in advanced positions is a documented limitation.\",\n          \"metadata\": {\n            \"teams\": [\"Senegal\"]\n          }\n        },\n        {\n          \"type\": \"breaking\",\n          \"headline\": \"Historical Context: 2002 Upset\",\n          \"body\": \"Senegal defeated defending champion France 1-0 in their only prior World Cup meeting at the 2002 tournament opener in Seoul. France will not underestimate Pape Thiaw's side, which also beat England 3-1 at Wembley last June.\",\n          \"metadata\": {\n            \"teams\": [\"France\", \"Senegal\"]\n          }\n        }\n      ]\n    },\n    {\n      \"title\": \"🛡️ DEFENSIVE SETUP\",\n      \"emoji\": \"🛡️\",\n      \"items\": [\n        {\n          \"type\": \"tactical\",\n          \"headline\": \"Pressing \u0026 Transition Management\",\n          \"body\": \"France must prevent Senegal's quick transitions through early, coordinated pressing—particularly winning the ball high when Gueye screens defensively. Senegal are dangerous in space, so France should avoid loose possession in midfield. Deschamps' proven 4-3-3/4-2-3-1 structure with Aurélien Tchouaméni and N'Golo Kanté as the defensive midfield pairing offers the control and mobility to disrupt Senegal's directness.\",\n          \"metadata\": {\n            \"teams\": [\"France\"]\n          }\n        },\n        {\n          \"type\": \"tactical\",\n          \"headline\": \"Isolating Mané \u0026 Managing Width\",\n          \"body\": \"Mané remains a threat despite age due to his technical quality and decision-making. France's fullbacks—Lucas Digne (Aston Villa) on the left, Malo Gusto (Chelsea) on the right—must balance defensive cover with aggressive pressing. Contain width early; Senegal thrive on wide platform transitions. Cover the space between fullback and center-back where Jackson and Ndiaye operate best.\",\n          \"metadata\": {\n            \"teams\": [\"France\"]\n          }\n        },\n        {\n          \"type\": \"tactical\",\n          \"headline\": \"Defending Set Pieces \u0026 Direct Play\",\n          \"body\": \"Senegal use Krepin Diatta, El Hadji Malick Diouf, Ismail Jakobs, and Lamine Camara as corner takers; Mané takes direct free kicks and penalties. With Koulibaly and Niakhaté strong aerially, France center-backs Jules Koundé (Barcelona), Ibrahima Konate (Liverpool), Dayot Upamecano (Bayern Munich), and William Saliba (Arsenal) must be alert to second-ball control and clearing lines.\",\n          \"metadata\": {\n            \"teams\": [\"France\"]\n          }\n        }\n      ]\n    },\n    {\n      \"title\": \"⚔️ ATTACKING PLAN\",\n      \"emoji\": \"⚔️\",\n      \"items\": [\n        {\n          \"type\": \"tactical\",\n          \"headline\": \"Exploiting Defensive Age \u0026 Tactical Gaps\",\n          \"body\": \"Koulibaly (34) and Niakhaté have shown early-season fatigue. France's pace in wide areas—particularly Ousmane Dembélé (PSG, Ballon d'Or winner), Désiré Doué, and Michael Olise—can stretch Senegal's fullbacks. Run at them repeatedly in the opening 20 minutes to establish rhythm and test their recovery speed. Senegal's compact defensive structure creates space for quick transitions; exploit this by playing one or two-touch passes through the lines.\",\n          \"metadata\": {\n            \"teams\": [\"France\"]\n          }\n        },\n        {\n          \"type\": \"tactical\",\n          \"headline\": \"Central Midfield Dominance \u0026 Control\",\n          \"body\": \"France have superior midfield quality. Tchouaméni and Kanté should dominate possession and tempo. Warren Zaire-Emery (PSG) or Adrien Rabiot (AC Milan) in the box-to-box role offer aggressive pressing and creative runs. Control the first 15 minutes to absorb Senegal's usual high-intensity start, then dictate play.\",\n          \"metadata\": {\n            \"teams\": [\"France\"]\n          }\n        },\n        {\n          \"type\": \"tactical\",\n          \"headline\": \"Targeting Gueye \u0026 Breaking Defensive Midfield Shield\",\n          \"body\": \"Idrissa Gueye screens the defense but is vulnerable to pressing. France's midfield should identify early if Gueye is stretched or isolated, then push through the lines quickly. Kylian Mbappé's pressing (Real Madrid captain in form) combined with Dembélé's movement can create early turnovers leading to direct chances.\",\n          \"metadata\": {\n            \"teams\": [\"France\"]\n          }\n        },\n        {\n          \"type\": \"tactical\",\n          \"headline\": \"Utilizing Width vs. Senegal's Fullbacks\",\n          \"body\": \"Senegal's fullbacks are experienced (Diatta, Diouf, Jakobs) but not elite defenders. France should target early crosses from deep or combine down the flanks with Digne/Gusto supporting attacks. Dembélé's directness and Olise's creativity from the right wing offer clear attacking avenues.\",\n          \"metadata\": {\n            \"teams\": [\"France\"]\n          }\n        }\n      ]\n    },\n    {\n      \"title\": \"🔗 KEY MATCHUPS\",\n      \"emoji\": \"🔗\",\n      \"items\": [\n        {\n          \"type\": \"tactical\",\n          \"headline\": \"Mbappé vs. Koulibaly \u0026 Niakhaté\",\n          \"body\": \"France captain Kylian Mbappé (Real Madrid, 56 goals for France) leads the line and needs just one goal to match Just Fontaine's World Cup record of 13. Mbappé's explosive pace and pressing will test Koulibaly's positional discipline. This matchup determines France's attacking rhythm in the first half.\",\n          \"metadata\": {\n            \"teams\": [\"France\", \"Senegal\"]\n          }\n        },\n        {\n          \"type\": \"tactical\",\n          \"headline\": \"Dembélé vs. Senegal Fullbacks\",\n          \"body\": \"Ousmane Dembélé (PSG, 35 goals in 2024-25 Champions League season, recent Ballon d'Or winner) will face Senegal's right flank. Dembélé's directness and previous Champions League form give France a clear advantage in one-on-one situations. Expect him to operate as a primary attacking catalyst on the right.\",\n          \"metadata\": {\n            \"teams\": [\"France\", \"Senegal\"]\n          }\n        },\n        {\n          \"type\": \"tactical\",\n          \"headline\": \"Tchouaméni \u0026 Kanté vs. Gueye \u0026 Senegal Midfield\",\n          \"body\": \"Real Madrid's Aurélien Tchouaméni and N'Golo Kanté (Fenerbahçe) provide France with elite midfield control. Senegal's midfield anchored by Gueye cannot match this quality in possession or pressing intensity. France should dominate tempo and transition speed in central areas.\",\n          \"metadata\": {\n            \"teams\": [\"France\", \"Senegal\"]\n          }\n        },\n        {\n          \"type\": \"tactical\",\n          \"headline\": \"Mendy vs. France Attack\",\n          \"body\": \"Édouard Mendy (former Chelsea, AFCON 2025 standout) has delivered consistent shot-stopping. Mbappé, Dembélé, and supporting attackers should test him early to assess sharpness after AFCON intensity. Mendy's distribution and sweeping are solid—France must press aggressively to avoid simple Senegal transitions.\",\n          \"metadata\": {\n            \"teams\": [\"France\", \"Senegal\"]\n          }\n        }\n      ]\n    },\n    {\n      \"title\": \"⚕️ SQUAD STATUS: Confirmed Injuries \u0026 Fitness\",\n      \"emoji\": \"⚕️\",\n      \"items\": [\n        {\n          \"type\": \"breaking\",\n          \"headline\": \"William Saliba - Injury Concern (Confirmed)\",\n          \"body\": \"Arsenal center-back William Saliba played all 120 minutes of the Champions League final in Budapest (June 7) but is experiencing pain from a previous injury. The French Football Federation (FFF) expressed genuine concern about his participation ahead of France's first match. Foot Mercato reported Saliba could be sidelined for several weeks, with his World Cup status in doubt as of June 8. Deschamps has adequate alternatives but Saliba's absence would be unwelcome. Monitor his status daily through official FFF announcements.\",\n          \"metadata\": {\n            \"teams\": [\"France\"]\n          }\n        },\n        {\n          \"type\": \"breaking\",\n          \"headline\": \"Hugo Ekitiké - Ruled Out (Confirmed)\",\n          \"body\": \"Liverpool forward Hugo Ekitiké suffered a season-ending Achilles injury in April. He was notably excluded from France's final 26-man squad announced June 2. This is a confirmed absentee with no replacement expectations.\",\n          \"metadata\": {\n            \"teams\": [\"France\"]\n          }\n        },\n        {\n          \"type\": \"breaking\",\n          \"headline\": \"Kylian Mbappé - Thigh Injury Reported\",\n          \"body\": \"Mbappé reported recent struggles with a thigh injury ahead of the World Cup. As of June 8, he is included in the confirmed squad and is expected to start. His status should be verified in official training updates from June 10-15.\",\n          \"metadata\": {\n            \"teams\": [\"France\"]\n          }\n        },\n        {\n          \"type\": \"breaking\",\n          \"headline\": \"Core Squad - Confirmed Available\",\n          \"body\": \"Ousmane Dembélé (PSG, fit after Champions League final June 7), Aurélien Tchouaméni (Real Madrid), N'Golo Kanté (Fenerbahçe), Jules Koundé (Barcelona), Ibrahima Konate (Liverpool), Dayot Upamecano (Bayern Munich), and Mike Maignan (AC Milan) are all confirmed fit and in the official 26-man squad. PSG contingent (Dembélé, Lucas Hernandez, Warren Zaire-Emery) and Arsenal players (Saliba pending, plus supporters) arrived late after Champions League commitments but are now in camp.\",\n          \"metadata\": {\n            \"teams\": [\"France\"]\n          }\n        },\n        {\n          \"type\": \"breaking\",\n          \"headline\": \"Notable Absences\",\n          \"body\": \"Eduardo Camavinga (Real Madrid) was excluded due to limited playing time and injuries during his season. Randal Kolo Muani (Tottenham) was replaced by Jean-Philippe Mateta (Crystal Palace) in the 26-man list. Florian Thauvin (Lens) also missed selection despite strong Ligue 1 form. These are confirmed exclusions by Didier Deschamps.\",\n          \"metadata\": {\n            \"teams\": [\"France\"]\n          }\n        }\n      ]\n    },\n    {\n      \"title\": \"📊 TACTICAL FRAMEWORK\",\n      \"emoji\": \"📊\",\n      \"items\": [\n        {\n          \"type\": \"tactical\",\n          \"headline\": \"France's Expected Setup\",\n          \"body\": \"Deschamps will likely deploy a 4-3-3 or 4-2-3-1 formation. Probable starting XI: Maignan (GK); Gusto (RB), Koundé (CB), Konate (CB), Digne (LB); Tchouaméni (CM), Kanté (CM); Dembélé (RW), Doué/Olise (CAM), Mbappé (LW); with Griezmann or another forward capable of flexible positioning. Depth across all lines ensures tactical flexibility and personnel freshness across three group matches.\",\n          \"metadata\": {\n            \"teams\": [\"France\"]\n          }\n        },\n        {\n          \"type\": \"tactical\",\n          \"headline\": \"Managing Tournament Intensity\",\n          \"body\": \"France are heavy favorites in Group I but cannot afford complacency. Deschamps, in his final tournament after 14 years, has confirmed he will prioritize tactical discipline and humility. Early dominance in midfield should translate to controlled scorelines, avoiding unnecessary fatigue before matches against Iraq and Norway.\",\n          \"metadata\": {\n            \"teams\": [\"France\"]\n          }\n        }\n      ]\n    }"])</script><script>self.__next_f.push([1,"8:[\"slug\",\"2026-06-08_team-preparation_france\",\"d\"]\nd:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"-57CsE-3CW3BvCcQxnR8L\",\"assetPrefix\":\"/wc26-news\",\"urlParts\":[\"\",\"entry\",\"2026-06-08_team-preparation_france\"],\"initialTree\":[\"\",{\"children\":[\"entry\",{\"children\":[[\"slug\",\"2026-06-08_team-preparation_france\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"2026-06-08_team-preparation_france\\\"}\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"entry\",{\"children\":[[\"slug\",\"2026-06-08_team-preparation_france\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[[\"$\",\"header\",null,{\"className\":\"masthead\",\"children\":[[\"$\",\"div\",null,{\"className\":\"mast-tier1\",\"children\":[[\"$\",\"div\",null,{\"className\":\"mast-tier1-left\",\"children\":[\"$\",\"div\",null,{\"className\":\"mast-logo-compact\",\"children\":[[\"$\",\"div\",null,{\"className\":\"mast-logo-icon\",\"children\":\"⚽\"}],[\"$\",\"div\",null,{\"className\":\"mast-logo-text\",\"children\":\"FIFA WC 2026\"}],[\"$\",\"div\",null,{\"className\":\"mast-logo-sep\",\"children\":\"|\"}],[\"$\",\"div\",null,{\"className\":\"mast-host-countries\",\"children\":\"CANADA · MEXICO · USA\"}]]}]}],[\"$\",\"div\",null,{\"className\":\"mast-tier1-right\",\"children\":[\"$\",\"div\",null,{\"className\":\"mast-info-compact\",\"children\":[\"$\",\"span\",null,{\"className\":\"mast-info-date\",\"children\":\"Jun 13\"}]}]}]]}],[\"$\",\"div\",null,{\"className\":\"mast-tier2\",\"children\":[[\"$\",\"div\",null,{\"className\":\"ma
