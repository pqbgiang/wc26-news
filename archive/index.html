<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Archive – WC26 News ⚽</title>
  <link rel="stylesheet" href="../css/styles.css"/>
  <link rel="stylesheet" href="../css/dark-theme.css"/>
  <script>
    (function(){
      var s=localStorage.getItem('wc26-theme');
      if(s){document.documentElement.setAttribute('data-theme',s);return;}
      if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme','dark');
    })();
  </script>
  <style>
    .archive-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      margin-top: 8px;
    }
    .archive-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: transform .15s, box-shadow .15s, border-color .15s;
    }
    .archive-item:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: rgba(0,63,138,.3);
    }
    .archive-date {
      font-size: 11px; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--text-3);
    }
    .archive-title {
      font-size: 15px; font-weight: 700; color: var(--text);
      line-height: 1.3;
    }
    .archive-desc { font-size: 12px; color: var(--text-2); line-height: 1.5; }
    .archive-footer-meta {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 6px;
    }
    .empty-state {
      text-align: center; padding: 60px 20px; color: var(--text-3);
    }
    .empty-state .icon { font-size: 40px; margin-bottom: 14px; }
    .empty-state p { font-size: 14px; }
    .page-title {
      font-family: var(--font-serif);
      font-size: 28px; font-weight: 700;
      margin-bottom: 6px; color: var(--text);
    }
    .page-sub { font-size: 14px; color: var(--text-3); margin-bottom: 24px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--wc-blue); text-decoration: none;
      font-size: 13px; font-weight: 600;
      margin-bottom: 24px;
      transition: opacity .15s;
    }
    .back-link:hover { opacity: .75; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <a href="../" class="site-logo">
      <span class="site-logo-icon">⚽</span>
      <div>
        <div class="site-logo-text">WC26 <span>News</span></div>
        <div class="site-logo-sub">Daily Feed · Auto-generated</div>
      </div>
    </a>
    <nav class="site-nav">
      <a href="../">Today</a>
      <a href="./" style="color:#fff;background:rgba(255,255,255,.15)">Archive</a>
      <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
    </nav>
    <button id="themeToggle" aria-label="Toggle dark mode" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">🌙</button>
  </div>
</header>

<main class="site-wrap">
  <a href="../" class="back-link">← Back to Today</a>
  <h1 class="page-title">📁 Archive</h1>
  <p class="page-sub">All past daily feeds generated by wc26analyzer.</p>

  <!-- Archive items auto-populated by wc26analyzer workflow -->
  <div class="archive-grid" id="archiveGrid">

    <!-- Empty state — shown when archive/ folder has no articles yet -->
    <div class="empty-state" style="grid-column:1/-1">
      <div class="icon">📭</div>
      <p>No archived articles yet.<br/>Check back after the first daily run!</p>
    </div>

    <!--
      wc26analyzer will inject entries like:
      <a href="2026-06-07.html" class="archive-item">
        <div class="archive-date">June 7, 2026</div>
        <div class="archive-title">Squad Updates & Group Stage Preview</div>
        <div class="archive-desc">Mbappé fit, Messi final WC, Germany's youth surge...</div>
        <div class="archive-footer-meta">
          <span class="wc-badge wc-badge-blue">Day 1</span>
          <span class="wc-tag">104 matches</span>
        </div>
      </a>
    -->

  </div>
</main>

<footer class="site-footer">
  <p>WC26 News &nbsp;·&nbsp; <a href="../">Home</a> &nbsp;·&nbsp; <span id="footerYear"></span></p>
</footer>

<script>
  document.getElementById('footerYear').textContent = new Date().getFullYear();
  var toggle = document.getElementById('themeToggle');
  function getTheme(){ return document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light'; }
  function setTheme(t){ document.documentElement.setAttribute('data-theme',t); localStorage.setItem('wc26-theme',t); toggle.textContent=t==='dark'?'☀️':'🌙'; }
  toggle.addEventListener('click',function(){ setTheme(getTheme()==='dark'?'light':'dark'); });
  toggle.textContent = getTheme()==='dark'?'☀️':'🌙';
</script>

</body>
</html>
